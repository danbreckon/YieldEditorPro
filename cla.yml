name: "CLA Assistant"

# Not enabled. This file is not in .github/workflows, so GitHub Actions
# does not run it. contributor-assistant/github-action is archived.
# Do not move this file into .github/workflows until the action is a
# maintained release and Cory Weber and Dan Breckon have agreed who the
# Project Owner is.
#
# When it is enabled, point path-to-document at this repo and allow both
# authors through. No extra secret is required if Actions has read and
# write permission.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/danbreckon/YieldEditorPro/blob/main/CLA.md'
          allowlist: 'danbreckon,CoryWeber1988,dependabot[bot]'
          branch: 'main'
          custom-notsigned-prcomment: |
            Thanks for the pull request! Before it can be merged, please read the [Contributor License Agreement](CLA.md) (or, if you're contributing on behalf of a company, the [Entity CLA](CLA-ENTITY.md)) and reply to this comment with:

            > I have read the CLA Document and I hereby sign the CLA
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
          lock-pullrequest-aftermerge: false
